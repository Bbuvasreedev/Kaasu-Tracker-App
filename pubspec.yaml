name: kaasutracker
description: A personal finance tracking application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fl_chart: ^1.1.1
  flutter_riverpod: ^3.4.3
  go_router: ^15.1.2
  http: ^1.6.0
  intl: ^0.20.2
  riverpod_annotation: ^4.0.7
  supabase_flutter: ^2.8.4
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.2
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9

flutter:
  generate: true
  uses-material-design: true
